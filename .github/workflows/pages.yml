# Publica la versión web (iPhone) en GitHub Pages desde la rama prod.
# El catálogo de RepDB se descarga al compilar: no está en el repositorio.
name: Publicar web

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run repdb
      - run: npm test
      - run: npm run build
        env:
          JOWYFIT_BASE: /JowyFit/
      - run: echo "{\"commit\":\"${GITHUB_SHA}\",\"fecha\":\"$(date -u +%FT%TZ)\"}" > dist/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
