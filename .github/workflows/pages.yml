# Publica la versión web (iPhone) en GitHub Pages desde la rama prod.
# El catálogo de RepDB se descarga al compilar: no está en el repositorio.
name: Publicar web

on:
  push:
    branches: [prod]
  workflow_dispatch:

# Por defecto solo leer; los permisos de publicar van únicamente en el trabajo que publica (no donde corre npm).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run repdb
        # Los ejercicios en catalán van cifrados en el repositorio (licencia de RepDB): esta es su clave.
        env:
          REPDB_CA_CLAVE: ${{ secrets.REPDB_CA_CLAVE }}
      - run: npm test
      - run: npm run build
        env:
          JOWYFIT_BASE: /JowyFit/
      - run: echo "{\"commit\":\"${GITHUB_SHA}\",\"fecha\":\"$(date -u +%FT%TZ)\"}" > dist/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
