# Pruebas completas: unitarias y de extremo a extremo (la app usada en un navegador sin ventana).
# Se lanzan al subir a Studio o pre-prod; prod solo recibe lo que ha pasado por aquí.
name: Pruebas

on:
  push:
    branches: [Studio, pre-prod]
  workflow_dispatch:

# Solo leer el repositorio: aquí corre código de terceros (npm) y no hace falta escribir nada.
permissions:
  contents: read

jobs:
  pruebas:
    # Fija la versión: con ubuntu-latest (26.04 desde nov. 2026) Playwright no tiene WebKit y fallan las de iPhone.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        # Sin dejar el token en .git/config, donde lo podría leer cualquier dependencia al ejecutarse.
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run repdb
        # Los ejercicios en catalán van cifrados en el repositorio (licencia de RepDB): esta es su clave.
        env:
          REPDB_CA_CLAVE: ${{ secrets.REPDB_CA_CLAVE }}
      - run: npm test
      - run: npm run build
      - run: npm run e2e
      # iPhone: la misma app en el motor de Safari (WebKit), con pantalla de iPhone.
      - run: npx playwright install --with-deps webkit
      - run: npm run e2e:iphone
      # Landing: el botón correcto según el navegador, sin errores y sin salirse de la pantalla.
      - run: npm run e2e:landing
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-fallos
          path: |
            .cache/e2e-fallo-*.png
            .cache/e2e-webkit/**/*.png
          if-no-files-found: ignore
